name: flutter_facebook_auth
description: The easiest way to add facebook login to your flutter app. Feature includes getting user information, profile picture and more. This plugin also supports Web, macOS and Windows.
version: 7.3.0
homepage: https://github.com/darwin-morocho/flutter-facebook-auth

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
    
  flutter_facebook_auth_platform_interface: ^6.1.2
  # flutter_facebook_auth_platform_interface:
    # path: ../facebook_auth_platform_interface
    
  flutter_facebook_auth_web: ^6.1.2
  # flutter_facebook_auth_web:
  #   path: ../facebook_auth_web

  # NOTE: bump to ^2.3.0 once facebook_auth_desktop 2.3.0 is published --
  # that is the first version with Windows support, which the `windows`
  # platform entry below relies on.
  facebook_auth_desktop: ^2.1.3
  # facebook_auth_desktop:
  #   path: ../facebook_auth_desktop
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  plugin:
    platforms:
      android:
        package: app.meedu.flutter_facebook_auth
        pluginClass: FlutterFacebookAuthPlugin
      ios:
        pluginClass: FlutterFacebookAuthPlugin
      web:
        default_package: flutter_facebook_auth_web
      macos:
        default_package: facebook_auth_desktop
      windows:
        default_package: facebook_auth_desktop


